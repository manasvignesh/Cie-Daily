name: cie_connect
description: "CIE Connect - Campus Discovery Platform"
publish_to: 'none'
version: 1.1.26+35

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.2.0
  
  # Backend & Realtime
  
  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Push Notifications & Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.0.1
  firebase_app_check: ^0.3.0+1
  google_sign_in: ^6.2.1
  
  # UI Components & Icons
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  video_player: ^2.8.7
  flutter_animate: ^4.5.0
  sentry_flutter: ^9.0.0
  
  # Utility
  connectivity_plus: ^6.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  url_launcher: ^6.3.1
  crypto: ^3.0.3
  livekit_client: ^2.3.0
  flutter_webrtc: ^0.12.12+hotfix.1
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  fonts:
    - family: BreakpointSplashOutfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf

  assets:
    - assets/icons/
    - assets/illustrations/
