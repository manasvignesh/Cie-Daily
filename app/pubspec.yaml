name: cie_connect
description: "CIE Connect - Campus Discovery Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.2.0
  
  # Backend & Realtime
  supabase_flutter: ^2.5.4
  
  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Push Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  
  # Monitoring
  sentry_flutter: 9.26.0
  
  # UI & Animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  
  # Live Audio/Video
  # Utilities
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - ../assets/illustrations/
    - ../assets/icons/
    - ../assets/animations/
    - .env
